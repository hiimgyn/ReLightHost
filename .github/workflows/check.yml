name: Check

on:
  push:
    branches: [master]
  pull_request:

# Lint + unit tests on every push/PR. Release builds live in release.yml.

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The node scripts below are run as plain .ts (type stripping:
          # Node >= 23.6); current LTS is newer than that.
          node-version: lts/*

      # Version comes from package.json "packageManager" — never "latest",
      # so a new pnpm major can't break a release build out of nowhere.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Frontend checks
        shell: bash # -e: any failing script fails the step (pwsh checks only the last)
        run: |
          node scripts/check-drop-target.ts
          node scripts/check-addon-ui.ts
          node addons/voice/ui/bode.check.ts

      # tauri::generate_context! embeds ../dist, so it must exist for cargo.
      - name: Build frontend
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Skipped: tests that need real audio hardware / the MMCSS service,
      # which CI runners don't have.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --workspace --lib -- --skip enum_tests --skip mmcss
